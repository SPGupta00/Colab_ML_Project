<!DOCTYPE html>

<html>

<head>

    <title>Hierarchical Clustering</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <header>

        <h1>Hierarchical Clustering</h1>

        <a href="/">Home</a>

    </header>


    <div class="container">

        <div class="model-box">

            <h2>Hierarchical Clustering</h2>

            <p>
                Method: Ward.D2
            </p>

            <button onclick="runModel()">
                Run Model
            </button>

        </div>


        <div id="result" class="result">

            <h2>Results</h2>

        </div>

    </div>


    <script>

        function runModel() {

            fetch("/run-hierarchical", {

                method: "POST"

            })

                .then(response => response.json())

                .then(data => {

                    if (data.error) {

                        document.getElementById("result").innerHTML =
                            "<h2>Error</h2><p>"
                            + data.error
                            + "</p>";

                        return;

                    }


                    let html = "";

                    html +=
                        "<h2>"
                        + data.model
                        + "</h2>";

                    html +=
                        "<p>Total Data Points: "
                        + data.total_points
                        + "</p>";

                    html +=
                        "<p>Clusters: "
                        + data.clusters
                        + "</p>";

                    html += "<h3>Cluster Sizes</h3>";

                    html += "<ul>";

                    data.cluster_sizes.forEach(
                        function (size, index) {

                            html +=
                                "<li>Cluster "
                                + (index + 1)
                                + ": "
                                + size
                                + " points</li>";

                        }
                    );

                    html += "</ul>";


                    document.getElementById("result").innerHTML =
                        html;

                });

        }

    </script>

</body>

</html>
