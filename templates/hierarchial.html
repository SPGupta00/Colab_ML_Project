<!DOCTYPE html>
<html>
<head>
    <title>Hierarchial Clustering</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Hierarchial Clustering</h1>
        <a href="/">Home</a>
    </header>

    <!-- MAIN STRUCTURAL WRAPPER: Flex layout mounts components side-by-side -->
    <div class="container" style="max-width: 1500px; margin: 0 auto; padding: 20px; display: flex; gap: 25px; align-items: start;">
        
        <!-- LEFT COLUMN: Parameter input and Plot Canvas -->
        <div style="flex: 1; min-width: 450px;">
            <div class="model-box" style="margin-bottom: 20px; box-sizing: border-box;">
                <h2>Hierarchial Clustering Model</h2>
                <p>Method: Complete Linkage</p>
                <button onclick="runModel()">Run Model</button>

                <div style="background: #fff; padding: 20px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; margin-top: 20px; box-sizing: border-box;">
                    <h3 style="margin-top: 0;">Dendrogram Tree Plot: </h3>
                    <!-- Plot placeholder element -->
                    <img id="dendrogram-img" src="" alt="" style="width: 100%; height: auto; border: 1px solid #eee; border-radius: 4px;">
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN: Interactive Status text & Result table layout -->
        <div style="flex: 1.5; min-width: 500px;">
            <!-- Initial text feedback wrapper -->
            <div id="status-message" style="background: #fff; padding: 20px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-top: 0;">
                <h2>Results</h2>
                <p>Run the model to see output data points and assigned clusters.</p>
            </div>

            <!-- RESULTS LAYOUT (Initially hidden, margin-top minimized to zero) -->
            <div id="result-layout" style="display: none; width: 100%; margin-top: 0;">
                <div style="background: #fff; padding: 20px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); width: 100%; box-sizing: border-box;">
                    <div id="metrics-summary"></div>
                    <h3 style="margin-top: 15px; margin-bottom: 10px;">Assigned Data Clusters</h3>
                    <div id="table-container" style="max-height: 650px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px; width: 100%;">
                        <!-- JS injects table elements here -->
                    </div>
                </div>
            </div>
        </div>

    </div>

    <footer>
        <p>Hierarchial Model Demo.</p>
    </footer>

    <script>
        function runModel() {
            // Display processing messaging layout 
            document.getElementById("status-message").innerHTML = "<h2>Processing...</h2><p>Running R script clustering calculations...</p>";
            document.getElementById("status-message").style.display = "block";
            document.getElementById("result-layout").style.display = "none";

            fetch("/run-hierarchial", {
                method: "POST"
            })
            .then(response => response.json())
            .then(payload => {
                if (payload.error) {
                    document.getElementById("status-message").innerHTML = "<h2>Error</h2><p>" + payload.error + "</p>";
                    return;
                }

                // Extracted array sent from R list(data = dframe)
                let records = payload.data; 

                // Hide initial status text message box
                document.getElementById("status-message").style.display = "none";

                // 1. Build and inject text metrics summary data
                let summaryHtml = "<h2 style='margin-top:0;'>Hierarchial Clustering Completed</h2>";
                summaryHtml += "<p><strong>Total Processed Points:</strong> " + records.length + "</p>";
                document.getElementById("metrics-summary").innerHTML = summaryHtml;
                
                // 2. Construct the data results mapping matrix table
                let tableHtml = "<table border='1' style='width:100%; border-collapse: collapse; text-align: left;'>";
                tableHtml += "<tr style='background-color: #f2f2f2; position: sticky; top: 0; z-index: 10;'><th>Customer ID</th><th>Age</th><th>Annual Income</th><th>Spending Score</th><th>Assigned Cluster</th></tr>";
                
                records.forEach(row => {
                    tableHtml += `<tr>
                        <td style="padding: 8px;">${row.CustomerID || 'N/A'}</td>
                        <td style="padding: 8px;">${row.Age || 'N/A'}</td>
                        <td style="padding: 8px;">${row.AnnualIncome || 'N/A'}</td>
                        <td style="padding: 8px;">${row.SpendingScore || 'N/A'}</td>
                        <td style="padding: 8px;"><strong style="color: blue;">Cluster ${row.Cluster}</strong></td>
                    </tr>`;
                });
                tableHtml += "</table>";
                document.getElementById("table-container").innerHTML = tableHtml;

                // 3. Extract the plot_url payload from R script and map to image source element node
                const dendroImg = document.getElementById("dendrogram-img");
                let assetPath = payload.plot_url ? payload.plot_url : "/static/hierarchical_plot.png";
                
                // Appends unique date timestamp token parameter avoiding aggressive browser engine memory caching
                dendroImg.src = assetPath + "?t=" + new Date().getTime();

                // Expose complete visual container layouts block
                document.getElementById("result-layout").style.display = "block";
            })
            .catch(error => {
                document.getElementById("status-message").style.display = "block";
                document.getElementById("status-message").innerHTML = "<h2>JavaScript Error</h2><p>" + error + "</p>";
            });
        }
    </script>
</body>
</html>
